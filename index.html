<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dynamic Regime Planner</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div class="settings-header no-export">
            <div class="flex items-center gap-1 border-r pr-2">
                Time:
                <input
                    type="number"
                    id="start-hour"
                    value="6"
                    style="width: 44px"
                />
                -
                <input
                    type="number"
                    id="end-hour"
                    value="22"
                    style="width: 44px"
                />
                Min/Row:
                <input
                    type="number"
                    id="row-duration"
                    value="30"
                    style="width: 56px"
                />m Interval:
                <input
                    type="number"
                    id="time-interval"
                    value="1"
                    style="width: 44px"
                />
            </div>

            <div class="flex items-center gap-2 border-r pr-2">
                <select id="header-pos">
                    <option value="top">Header Top</option>
                    <option value="bottom">Header Bottom</option>
                </select>
                <select id="table-dir">
                    <option value="normal">Morn ↓</option>
                    <option value="reverse">Eve ↓</option>
                </select>
            </div>

            <div
                id="typo-btns"
                class="flex gap-1 overflow-x-auto max-w-md"
            ></div>

            <div class="ml-auto flex gap-2">
                <button onclick="addActivity()" class="btn btn-ghost">
                    Add Activity
                </button>
                <button onclick="addSection()" class="btn btn-ghost">
                    Add Section
                </button>
                <button onclick="exportJSON()" class="btn btn-primary">
                    Export JSON
                </button>
                <button onclick="triggerImportJSON()" class="btn btn-primary">
                    Import JSON
                </button>
                <button onclick="exportPNG()" class="btn btn-primary">
                    Export PNG
                </button>
                <button
                    onclick="resetTool()"
                    id="reset-btn"
                    class="btn btn-danger"
                >
                    Reset
                </button>
            </div>
        </div>

        <div id="capture-area" class="regime-container">
            <div id="main-grid" class="regime-grid"></div>
        </div>

        <input
            type="file"
            id="import-file"
            accept="application/json"
            style="display: none"
            class="no-export"
        />
        <div
            id="measurer-container"
            style="position: absolute; top: -9999px; left: -9999px"
        >
            <div
                id="measurer"
                style="
                    width: 120px;
                    white-space: pre-wrap;
                    word-wrap: break-word;
                "
            ></div>
        </div>

        <div id="global-palette" class="floating-menu">
            <div class="menu-grid" id="palette-grid"></div>
        </div>

        <div id="typo-menu" class="floating-menu p-3">
            <div
                class="text-[9px] font-bold uppercase mb-2 text-gray-400"
                id="typo-menu-title"
            >
                Typography
            </div>
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between gap-4">
                    <span class="text-[10px]">Size:</span>
                    <input
                        type="number"
                        id="font-size-input"
                        class="w-12 border rounded px-1 text-[10px]"
                    />
                </div>
                <div class="flex items-center justify-between gap-4">
                    <span class="text-[10px]">Font:</span>
                    <select
                        id="font-family-input"
                        class="text-[10px] border rounded"
                    >
                        <option value="'Segoe UI', sans-serif">Segoe UI</option>
                        <option
                            value="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
                        >
                            Inter / System
                        </option>
                        <option
                            value="Roboto, 'Helvetica Neue', Arial, sans-serif"
                        >
                            Roboto
                        </option>
                        <option value="'Open Sans', Arial, sans-serif">
                            Open Sans
                        </option>
                        <option value="Lato, Arial, sans-serif">Lato</option>
                        <option value="'Montserrat', Arial, sans-serif">
                            Montserrat
                        </option>
                        <option value="'Times New Roman', serif">Times</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Courier New', monospace">
                            Courier
                        </option>
                        <option value="monospace">Mono</option>
                    </select>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
